
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Registrar variedad NIRP</title>
</head>

<body>

    <h1>Registro de variedades NIRP</h1>

    <form action="{{ url_for('registrar_variedad') }}"
          method="POST">

        <label for="nombre">Nombre de la rosa:</label>
        <input type="text"
               id="nombre"
               name="nombre"
               required>

        <label for="color">Color:</label>
        <input type="text"
               id="color"
               name="color"
               required>

        <button type="submit">
            Registrar variedad
        </button>

    </form>

</body>
</html>
